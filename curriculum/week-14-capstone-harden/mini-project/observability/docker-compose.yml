# Polyglot Workshop — local observability stack.
# Brings up the OpenTelemetry Collector + Loki (logs) + Tempo (traces) +
# Prometheus (metrics) + Grafana (the single pane of glass).
#
#   docker compose -f observability/docker-compose.yml up -d
#   # then point the app at the collector:  Otel__Endpoint=http://localhost:4317
#   # Grafana: http://localhost:3000  (anonymous Admin enabled for local dev)
#
# Citations:
#   Collector: https://opentelemetry.io/docs/collector/
#   Tempo:     https://grafana.com/docs/tempo/latest/
#   Loki:      https://grafana.com/docs/loki/latest/

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on: [loki, tempo, prometheus]

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
    ports:
      - "3200:3200"   # Tempo query API

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=exemplar-storage"   # REQUIRED for exemplars (metric -> trace link)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [loki, tempo, prometheus]
