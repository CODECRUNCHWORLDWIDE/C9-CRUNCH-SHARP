# Tempo (traces) single-binary config for local dev.
# Receives traces over OTLP from the collector and serves the query API on :3200.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Generate service-graph and span metrics so the Grafana service map works.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
  processor:
    service_graphs: {}
    span_metrics: {}

overrides:
  metrics_generator_processors: [service-graphs, span-metrics]
