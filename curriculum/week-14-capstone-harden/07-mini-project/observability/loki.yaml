# Loki (logs) single-binary config for local dev.
# Accepts OTLP logs (via the collector's otlphttp/loki exporter at /otlp) and
# serves the query API on :3100.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true   # required for OTLP log ingestion (TraceId as metadata)
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: ["service.name"]
